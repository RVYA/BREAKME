<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 164" width="100%" height="100%">
<defs>
	<g id="char-base">
		<path d="M10 0a2.83 2.83 0 0 0-2.83 2.83A2.83 2.83 0 0 0 10 5.67a2.83 2.83 0 0 0 2.83-2.84A2.83 2.83 0 0 0 10 0m0 5.67H0V9h6.67v2.98L1 17.64 3.36 20 10 13.36 16.64 20 19 17.64l-5.67-5.66V9H20V5.67h-6.67z"/>
	</g>
	<g id="tile-base">
		<path d="M2 0a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2Z"/>
	</g>
	<g id="tile-hidden">
		<circle cx="10" cy="10" r="4"/>
	</g>
	<radialGradient id="gradient-dirt" cx="50%" cy="50%" r="50%">
	<stop offset="30%" stop-color="#5e3023" />
	<stop offset="90%" stop-color="#895737" />
</radialGradient>
<linearGradient id="gradient-gold" x1="5%" y1="5%" x2="95%" y2="95%">
	<stop offset="5%" stop-color="#020024" />
	<stop offset="50%" stop-color="#ffdd00" />
	<stop offset="95%" stop-color="#020024" />
</linearGradient>
</defs>
<style>
:root {
	--bg: hsl(267, 45%, 6%);
	--fg: hsl(267, 69%, 81%);
	--accent: hsl(267, 28%, 18%);
}
.variant-dirt {
	/*fill: #5e3023;*/
	fill: url("#gradient-dirt");
}

.variant-gold {
	/*fill: #020024;*/
	fill: url("#gradient-gold");
}

.variant-broken {
	clip-path: polygon(
		0% 0%,
		0% 100%,
		53% 100%,
		38% 83%,
		49% 33%,
		38% 0%,
		47% 0%,
		60% 23%,
		49% 74%,
		59% 100%,
		100% 100%,
		100% 0%
	);
	fill: #656565;
}

.effect-negative {
	stroke: #000000;
	stroke-width: 1;
}

.effect-shiny {
	stroke: #ffd700;
	stroke-width: 1;
}

.effect-hot {
	stroke: #dc143c;
	stroke-width: 1;
}

.effect-cold {
	stroke: #f0ffff;
	stroke-width: 1;
}

.effect-wet {
	stroke: #00008b;
	stroke-width: 1;
}

@keyframes player-sway {
	0%, 100% {
		transform: rotate(-15deg);
	}
	50% {
		transform: rotate(15deg);
	}
}

.player {
	transform-box: fill-box;
	transform-origin: center;
	animation: player-sway 8s ease-in-out infinite;
}


.bg {
	fill: var(--bg, #0d1117);
}

.fg {
	fill: var(--fg, #f0f6fc);
}

.accent {
	fill: var(--accent, #21262d);
}
</style>
