name: BREAKME.md Game Loop

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "state.json"
      - "BREAKME-board.svg"
      - ".agents/**"
      - "README.md"

permissions:
  contents: write

jobs:
  game-turn:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run BREAKME Game Action
        uses: ./
        with:
          github_token: ${{ secrets.BREAKME_PAT || secrets.GITHUB_TOKEN }}
          breakme_username: ${{ github.repository_owner }}

      - name: Commit and Push Game Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json BREAKME-board.svg
          git diff --staged --quiet || git commit -m "chore(game): update BREAKME game board [skip ci]"
          git push
