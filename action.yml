name: "BREAKME"
description: "Commit-based incremental block-mining game for your GitHub profile"
author: "RVYA"
branding:
  icon: "grid"
  color: "purple"

inputs:
  github_token:
    description: "Personal Access Token (BREAKME_PAT) for private events or fallback GITHUB_TOKEN"
    required: false
    default: "${{ github.token }}"
  breakme_username:
    description: "Target GitHub username to track"
    required: false
    default: "${{ github.repository_owner }}"
  state_path:
    description: "Relative path to state.json"
    required: false
    default: "state.json"
  svg_path:
    description: "Relative path to output SVG board"
    required: false
    default: "BREAKME-board.svg"

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci

    - name: Run BREAKME Engine
      shell: bash
      env:
        BREAKME_USERNAME: ${{ inputs.breakme_username }}
        BREAKME_PAT: ${{ inputs.github_token }}
        STATE_PATH: ${{ inputs.state_path }}
        SVG_PATH: ${{ inputs.svg_path }}
      run: |
        node --experimental-strip-types "${{ github.action_path }}/src/main.ts"
